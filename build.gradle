plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

version = '1.0.0'           // zmień na wersję swojego cheata
group = 'pl.twojnick.cheaty12333'   // możesz zmienić na swój package

base {
    archivesName = 'cheaty12333'
}

repositories {
    mavenCentral()
}

dependencies {
    // Minecraft + Fabric
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings 'net.fabricmc:yarn:1.21.4+build.8:v2'     // najnowsze yarn dla 1.21.4
    modImplementation 'net.fabricmc:fabric-loader:0.16.9'

    // Fabric API (najnowsza stabilna na 1.21.4)
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.113.0+1.21.4'

    // Opcjonalnie: Kotlin (jeśli chcesz pisać w Kotlinie)
    // modImplementation 'net.fabricmc:fabric-language-kotlin:1.12.3+kotlin.2.0.21'
}

loom {
    accessWidenerPath = file('src/main/resources/cheaty12333.accesswidener')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Publikowanie na GitHub (jeśli chcesz)
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}